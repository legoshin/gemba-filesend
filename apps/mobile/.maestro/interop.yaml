# Maestro flow for the walking-skeleton interop gate (CRYPTO-03, D-04, D-05).
#
# jest-expo cannot execute react-native-quick-crypto's real JSI/Nitro
# binding (it mocks native modules and runs in Node/jsdom) — so the real
# native-crypto gate runs here, on-device, against an EAS dev-client build.
# This flow launches the app, opens the throwaway interop harness route
# (apps/mobile/app/harness.tsx), and asserts the rendered result is exactly
# "VECTORS PASS" (fails on "VECTORS FAIL" or a timeout).
#
# Run locally:  maestro test apps/mobile/.maestro/interop.yaml
# Target: an installed EAS dev-client build (development profile, eas.json)
# running on the iOS simulator or Android emulator (or a real device).
appId: gemba.filesend
---
- launchApp
- tapOn: "Open interop harness"
- assertVisible:
    text: "VECTORS PASS"
    timeout: 15000
