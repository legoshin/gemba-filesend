<!-- @dsCard group="Colors" viewport="700x150" name="Brand accent" subtitle="Gemba yellow — reserved for the mark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); display:flex; gap:16px; align-items:center; }
  .chip { width: 96px; height: 96px; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(40,51,73,.08); }
  .n { font: 700 14px/20px var(--font-sans); color: var(--text-primary); }
  .h { font: 400 12px/18px var(--font-sans); color: var(--text-subdued); max-width: 360px; }
</style>
</head>
<body>
  <div class="chip" style="background:var(--gemba-yellow)"></div>
  <div>
    <div class="n">Gemba Yellow · #FFDA44</div>
    <div class="h">The single warm accent in an otherwise cool, ink-and-grey system. Used only inside the brand mark and rare highlight moments — never for UI status.</div>
  </div>
</body>
</html>
