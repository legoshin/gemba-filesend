<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Soft cool-grey shadows: field, card, popover" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--surface-card); display:flex; gap:32px; align-items:center; }
  .sw { display:flex; flex-direction:column; gap:10px; align-items:center; }
  .box { width: 140px; height: 72px; background: #fff; border-radius: 12px; }
  .n { font: 700 12px/16px var(--font-sans); color: var(--text-primary); }
  .h { font: 400 11px/14px var(--font-sans); color: var(--text-subdued); }
</style>
</head>
<body>
  <div class="sw"><div class="box" style="box-shadow:var(--ring-border), var(--shadow-field)"></div><span class="n">Field</span><span class="h">4px 16px / 6%</span></div>
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-card)"></div><span class="n">Card</span><span class="h">4px 16px / 6%</span></div>
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-popover)"></div><span class="n">Popover</span><span class="h">12px 32px / 16%</span></div>
</body>
</html>
