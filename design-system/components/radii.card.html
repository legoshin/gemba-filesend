<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="4 · 8 · 12 · 16 · 24 · pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); display:flex; gap:20px; align-items:flex-end; }
  .sw { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .box { width: 72px; height: 72px; background: var(--surface-subdued); box-shadow: inset 0 0 0 1px var(--gemba-border); }
  .n { font: 700 12px/16px var(--font-sans); color: var(--text-primary); }
</style>
</head>
<body>
  <div class="sw"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="n">4 · xs</span></div>
  <div class="sw"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="n">8 · sm</span></div>
  <div class="sw"><div class="box" style="border-radius:var(--radius-md)"></div><span class="n">12 · md</span></div>
  <div class="sw"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="n">16 · lg</span></div>
  <div class="sw"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="n">24 · xl</span></div>
  <div class="sw"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="n">pill</span></div>
</body>
</html>
