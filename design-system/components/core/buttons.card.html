<!-- @dsCard group="Components" viewport="700x430" name="Buttons & Chips" subtitle="Primary, secondary, tertiary, ghost, store & status chips" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 20px; }
  .lbl { font: 700 12px/16px var(--font-sans); color: var(--text-subdued); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 10px; }
  .grp { margin-bottom: 22px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { PrimaryButton, SecondaryButton, TertiaryButton, GhostButton, Chip } = window.GembaDesignSystem_26dc89;
function App() {
  return (
    <div>
      <div className="grp">
        <p className="lbl">Buttons — default & square</p>
        <div className="row">
          <PrimaryButton buttonLabel="Send money" showPrefix={false} showSuffix={false} />
          <SecondaryButton buttonLabel="Add account" showPrefix={false} showSuffix={false} />
          <TertiaryButton buttonLabel="Details" showPrefix={false} showSuffix={false} />
          <GhostButton buttonLabel="Cancel" showPrefix={false} showSuffix={false} />
        </div>
        <div className="row">
          <PrimaryButton style2="square" buttonLabel="Confirm" showPrefix={false} showSuffix={false} />
          <PrimaryButton style2="small" buttonLabel="Small" showPrefix={false} showSuffix={false} />
          <SecondaryButton style2="square" buttonLabel="Export" showPrefix={false} showSuffix={false} />
        </div>
      </div>
      <div className="grp">
        <p className="lbl">Status chips</p>
        <div className="row">
          <Chip style2="neutral" text1="DRAFT" prefixIcon={false} />
          <Chip style2="accent" text1="PENDING" prefixIcon={false} />
          <Chip style2="success" text1="RECEIVED" prefixIcon={false} />
          <Chip style2="warning" text1="ON HOLD" prefixIcon={false} />
          <Chip style2="critical" text1="REJECTED" prefixIcon={false} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
